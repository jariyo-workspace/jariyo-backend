spring.application.name=jariyo-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jariyo}
spring.datasource.username=${DB_USERNAME:jariyo}
spring.datasource.password=${DB_PASSWORD:jariyo}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

security.jwt.issuer=${JWT_ISSUER:https://api.jariyo.local}
security.jwt.audience=${JWT_AUDIENCE:jariyo-web}
security.jwt.access-token-ttl=PT15M
security.jwt.public-key=${JWT_PUBLIC_KEY:}
security.jwt.private-key=${JWT_PRIVATE_KEY:}
security.refresh-token.ttl=P14D
security.refresh-token.cookie-secure=true
