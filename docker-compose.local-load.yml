name: jariyo-local-load

services:
  postgres:
    image: postgres:17-alpine
    container_name: jariyo-local-postgres
    environment:
      POSTGRES_DB: jariyo
      POSTGRES_USER: jariyo
      POSTGRES_PASSWORD: jariyo
      TZ: Asia/Seoul
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jariyo -d jariyo"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - jariyo-local-postgres-data:/var/lib/postgresql/data
    mem_limit: 768m
    cpus: 0.75
    networks:
      - jariyo-local-network

  app-a:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./docker/local-load/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jariyo
      DB_USERNAME: jariyo
      DB_PASSWORD: jariyo
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1024m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - jariyo-local-network

  app-b:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./docker/local-load/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jariyo
      DB_USERNAME: jariyo
      DB_PASSWORD: jariyo
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1024m
    cpus: 1.0
    restart: unless-stopped
    networks:
      - jariyo-local-network

  nginx:
    image: nginx:1.27-alpine
    container_name: jariyo-local-nginx
    depends_on:
      - app-a
      - app-b
    ports:
      - "8080:8080"
    volumes:
      - ./docker/local-load/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    networks:
      - jariyo-local-network

volumes:
  jariyo-local-postgres-data:

networks:
  jariyo-local-network:
